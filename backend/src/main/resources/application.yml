spring:
  application:
    name: pricing-middleware
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pricing}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:pricing_app}
    password: ${MYSQL_PASSWORD:pricing_local_password}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

pricing:
  cache:
    fresh-ttl: ${PRICE_CACHE_FRESH_TTL:60s}
    fallback-ttl: ${PRICE_CACHE_FALLBACK_TTL:15m}
    maximum-size: ${PRICE_CACHE_MAXIMUM_SIZE:10000}
  providers:
    a:
      base-url: ${PROVIDER_A_BASE_URL:http://localhost:${PROVIDER_A_PORT:8081}}
      connect-timeout-ms: ${PROVIDER_A_CONNECT_TIMEOUT_MS:200}
      read-timeout-ms: ${PROVIDER_A_READ_TIMEOUT_MS:250}
    b:
      base-url: ${PROVIDER_B_BASE_URL:http://localhost:${PROVIDER_B_PORT:8082}}
      connect-timeout-ms: ${PROVIDER_B_CONNECT_TIMEOUT_MS:200}
      read-timeout-ms: ${PROVIDER_B_READ_TIMEOUT_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
