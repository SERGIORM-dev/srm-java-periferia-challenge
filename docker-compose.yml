name: periferia-pricing

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pricing}
      MYSQL_USER: ${MYSQL_USER:-pricing_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pricing_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pricing_root_local_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
          --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --batch --skip-column-names --execute='SELECT 1' >/dev/null
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  provider-a:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating"]
    ports:
      - "127.0.0.1:${PROVIDER_A_PORT:-8081}:8080"
    volumes:
      - ./providers/provider-a:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/__admin/health"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  provider-b:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating"]
    ports:
      - "127.0.0.1:${PROVIDER_B_PORT:-8082}:8080"
    volumes:
      - ./providers/provider-b:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/__admin/health"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pricing}
      MYSQL_USER: ${MYSQL_USER:-pricing_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pricing_local_password}
      PROVIDER_A_BASE_URL: http://provider-a:8080
      PROVIDER_B_BASE_URL: http://provider-b:8080
      PROVIDER_A_CONNECT_TIMEOUT_MS: ${PROVIDER_A_CONNECT_TIMEOUT_MS:-200}
      PROVIDER_A_READ_TIMEOUT_MS: ${PROVIDER_A_READ_TIMEOUT_MS:-250}
      PROVIDER_B_CONNECT_TIMEOUT_MS: ${PROVIDER_B_CONNECT_TIMEOUT_MS:-200}
      PROVIDER_B_READ_TIMEOUT_MS: ${PROVIDER_B_READ_TIMEOUT_MS:-1000}
      PRICE_CACHE_FRESH_TTL: ${PRICE_CACHE_FRESH_TTL:-60s}
      PRICE_CACHE_FALLBACK_TTL: ${PRICE_CACHE_FALLBACK_TTL:-15m}
      PRICE_CACHE_MAXIMUM_SIZE: ${PRICE_CACHE_MAXIMUM_SIZE:-10000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "4"
        - http://localhost:8080/actuator/health
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  mysql_data:
